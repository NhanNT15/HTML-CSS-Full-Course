<!doctype html>
<html>
  <head>
    <style>
      .absolute {
        position: absolute;
        top: 10px;
        right: 10px;
      }
      .background {
        display: flex;
        background-color: black;
        border-radius: 50%;
        width: 25px;
        height: 25px;
        padding: 4px 4px;
        justify-content: center;
        align-items: center;
      }
      .background p {
        color: white;
        border-radius: 100%;
      }
    </style>
  </head>
  <body>
    <div class="absolute">
      <div class="background"><p>X</p></div>
    </div>
  </body>
</html>
